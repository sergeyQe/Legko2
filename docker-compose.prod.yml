# Боевой запуск: PostgreSQL + бэкенд + Caddy (фронтенд и HTTPS). Работает с реальным тестовым Keitaro.
# Запуск: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: legko2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env.prod}
      POSTGRES_DB: legko2
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legko2 -d legko2"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://legko2:${POSTGRES_PASSWORD}@db:5432/legko2
      KEITARO_URL: ${KEITARO_URL:?задайте KEITARO_URL в .env.prod}
      KEITARO_API_KEY: ${KEITARO_API_KEY:?задайте KEITARO_API_KEY в .env.prod}
      CAMPAIGN_PREFIX: ${CAMPAIGN_PREFIX:?задайте CAMPAIGN_PREFIX в .env.prod}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-kylovoa.com}
      DEFAULT_GROUP: ${DEFAULT_GROUP:-FORTESTS}
      DEFAULT_SOURCE: ${DEFAULT_SOURCE:-FORTESTS}
      ROOT_PATH: /api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
